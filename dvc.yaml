stages:
  download:
    cmd: python src/datasets/download_data.py
    outs:
      - data/raw/titanic.csv

  prepare:
    cmd: python src/datasets/prepare_data.py
    deps:
      - data/raw/titanic.csv
      - src/datasets/prepare_data.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/models/train_model.py
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/models/train_model.py
    outs:
      - models/model.joblib
    metrics:
      - metrics.json:
          cache: false